<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>CKEditor Test - WProofreader Bootstrap</title>
        <base href="../../../../" />
        <link rel="stylesheet" type="text/css" href="js/lib/qunit/qunit.css">
        <script type="text/javascript" src="js/lib/qunit/qunit.js"></script>
        <script type="text/javascript" src="js/lib/require.js"></script>
        <script type="text/javascript">
            QUnit.config.autostart = false;

            require(['/tao/ClientConfig/config'], function () {
                require.config({
                    config: {
                        'tao/ckeditor/wproofreaderBootstrap': {
                            spellCheckConfig: {
                                enabled: true,
                                providerId: 'wproofreader',
                                providerConfig: {
                                    serviceId: 'test'
                                }
                            }
                        }
                    }
                });

                require(['test/ckeditor/wproofreaderBootstrap/test'], function () {
                    QUnit.start();
                });
            });
        </script>
    </head>
    <body>
        <div id="qunit"></div>
        <div id="qunit-fixture"></div>
    </body>
</html>
